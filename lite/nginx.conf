# WordCraft lite static site. Files are pre-compressed at build time (.br and .gz next to each file).
# Stock nginx has no brotli module, so the .br copy is picked by hand here.
map $http_accept_encoding $br_suffix {
    default "";
    "~*\bbr\b" ".br";
}
map $br_suffix $br_encoding {
    ".br" br;
    default "";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    gzip_static on;

    # Hashed assets (trunk filehash = true): cache forever.
    location ~* \.wasm$ {
        types {} default_type application/wasm;
        add_header Content-Encoding $br_encoding always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary Accept-Encoding always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri$br_suffix $uri =404;
    }
    location ~* \.js$ {
        types {} default_type text/javascript;
        add_header Content-Encoding $br_encoding always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary Accept-Encoding always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri$br_suffix $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ =404;
    }
}
